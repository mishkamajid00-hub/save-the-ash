<script>
const $=id=>document.getElementById(id);
const S={o:100,p:100,f:100,h:100,s:100};
const N={o:'Oxygen',p:'Power',f:'Food',h:'Health',s:'Sanity'};
const COL={o:'#7fd1ff',p:'#ffd34d',f:'#ff9b54',h:'#ff6b8b',s:'#b58cff'};
let day=1,fx='',phase='intro',plan=[],lastRes=null,audioOn=false,resc=null;

/* ---------- EVENTS ---------- */
const MAJ={
3:{fx:'dust',t:'Regolith Storm',x:'A wall of electrostatic lunar dust sweeps over the ridge. Fine as flour, sharp as glass, it clings to everything and your solar panels go dim.',c:[
['Seal every vent and wait it out','Safe, but power starves',{p:-12,s:-6},'You sit in the dark, listening to grit hiss against the hull.'],
['Suit up and sweep the panels','Restores power, wrecks your lungs',{p:10,h:-14,o:-8},'The dust gets into your suit seals. Every breath burns afterward.'],
['Run the filters on high','Clean air, huge power cost',{o:6,p:-16},'The air stays sweet. The battery gauge does not.']]},
6:{fx:'quake',t:'Moonquake',x:'The floor shudders. A shallow quake, probably the Lee-Lincoln fault again, and unlike Earth’s tremors this one rolls on for hours. Loose cans rattle off shelves.',c:[
['Ride it out strapped to your bunk','Cheap, but seals may creak',{o:-14,s:-4},'Three hours of shaking. A microleak opens near the airlock and you lose air before you find it.'],
['Check the seals while it shakes','Saves air, risks injury',{h:-14,s:-2},'You crawl along the walls and catch the crack, and a falling crate catches your shoulder.'],
['Power down the reactor to protect it','Safe hardware, lost power',{p:-14,s:-5},'The base goes silent and black until the quake finally fades.']]},
9:{fx:'comms',t:'Silence from Earth',x:'The link drops. No voice from Houston, no telemetry, just static. Rescue timelines were all you had to hold onto.',c:[
['Climb out and realign the dish','Restores contact, risky EVA',{h:-8,o:-8,s:8},'Cold metal, shaking hands, then a crackle: “…hold on, we’re coming.”'],
['Route power to the backup radio','Quick fix, drains battery',{p:-16,s:5},'A thin signal returns. The lights dim to pay for it.'],
['Wait and trust the silence','Costs nothing but your nerve',{s:-16},'Hours pass. You start talking to the empty room.']]},
12:{t:'The Freezer Failed',x:'A cooling line has cracked. Half your food packs are slumped, warm, and smell wrong.',c:[
['Eat the questionable stock','Keeps calories, risks sickness',{f:-4,h:-16},'It stays down, barely. Your gut punishes you all night.'],
['Throw out the spoiled half','Safe, but less food',{f:-24},'The bin fills quickly. The shelves look cruelly bare.'],
['UV-sterilize what you can','Salvages some, burns power',{f:-10,p:-12},'The lamp hums for hours. Most of it is edible again.']]},
15:{fx:'rad',t:'Solar Flare',x:'The alarm screams: a solar particle event, on top of the constant cosmic radiation. Without a magnetic field the Moon offers no shelter but your own walls.',c:[
['Hide in the water-shielded core','Safe, but cramped and dark',{p:-6,s:-9},'You wait among water tanks, counting the dosimeter ticks.'],
['Keep working and trust the hull','Keeps routine, hurts you',{h:-20},'The dosimeter creeps into the red. Your head throbs for days.'],

const CALL=[
['Ask for a rescue timeline and moral support','Hope helps, but the transmitter drains power',{s:12,p:-10},'The crew reads you the launch plan and your family’s messages. Ten days feels survivable, and the dish burns a chunk of your battery.'],

setInterval(()=>{if(!audioOn||!hz)return;[0,.28].forEach(dl=>{const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime+dl;o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(30,t+.25);gn.gain.setValueAtTime(.5,t);gn.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+.35);});
if(Math.random()<.3){const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(1300,t);o.frequency.exponentialRampToValueAtTime(700,t+1.2);gn.gain.setValueAtTime(.001,t);gn.gain.linearRampToValueAtTime(.05,t+.2);gn.gain.exponentialRampToValueAtTime(.001,t+1.3);o.connect(gn);gn.connect(lp);o.start(t);o.stop(t+1.4);}},1000);}
pl();
intro();

/* ---------- RADIO VOICE ---------- */
let radioOn=true,nzg=null,crk=null;
(function(){const st=document.createElement('style');st.textContent='#rad{width:38px;height:38px;border-radius:50%;padding:0;font-size:17px;background:#ffffff12;border:2px solid #7fd1ff88;box-shadow:0 0 14px #7fd1ff44;cursor:pointer;color:#fff;transition:.2s}#rad.off{opacity:.4}#rad.on{animation:pul 1s infinite}';document.head.appendChild(st);
const b=document.createElement('button');b.id='rad';b.title='Radio voice';b.textContent='\u{1F4FB}';b.onclick=()=>{radioOn=!radioOn;b.classList.toggle('off',!radioOn);if(!radioOn)stopRadio();else if(AC)say(cardText())};$('dp').appendChild(b);})();
function ensureNoise(){if(nzg||!AC)return;const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=buf;s.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2200;bp.Q.value=.6;nzg=AC.createGain();nzg.gain.value=0;s.connect(bp);bp.connect(nzg);nzg.connect(master);s.start();}
function blip(f,dur){if(!AC)return;const o=AC.createOscillator(),g2=AC.createGain(),t=AC.currentTime;o.type='square';o.frequency.value=f;g2.gain.setValueAtTime(.04,t);g2.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g2);g2.connect(master);o.start(t);o.stop(t+dur+.02);}
function staticOn(){ensureNoise();if(!nzg)return;blip(1400,.12);nzg.gain.setTargetAtTime(.09,AC.currentTime,.05);clearInterval(crk);crk=setInterval(()=>{const t=AC.currentTime,r=Math.random();nzg.gain.setTargetAtTime(r<.15?.35:r<.35?.02:.06+Math.random()*.08,t,.015);},110);}
function staticOff(){clearInterval(crk);if(nzg){nzg.gain.setTargetAtTime(0,AC.currentTime,.08);blip(900,.15);}}
function stopRadio(){try{speechSynthesis.cancel()}catch(e){}staticOff();}
function say(txt){if(!radioOn||!window.speechSynthesis||!AC||!txt)return;txt=txt.replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\u2665]/gu,'').replace(/CO\u2082/g,'C O 2').replace(/\s+/g,' ').trim();if(!txt)return;
speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt),vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));u.voice=vs.find(v=>/male|david|daniel|alex|mark|george/i.test(v.name))||vs[0]||null;u.rate=.95;u.pitch=.65;u.volume=.9;u.onstart=staticOn;u.onend=staticOff;u.onerror=staticOff;speechSynthesis.speak(u);}
function cardText(){const c=$('card');if(c.style.display==='none')return '';const h=c.querySelector('h1'),ps=[...c.querySelectorAll('p')].map(p=>p.textContent);return (h?h.textContent+'. ':'')+ps.join(' ');}
let sayT;new MutationObserver(()=>{clearTimeout(sayT);sayT=setTimeout(()=>{if(AC&&phase!=='intro')say(cardText())},120);}).observe($('card'),{childList:true});
new MutationObserver(m=>{m.forEach(r=>r.addedNodes.forEach(n=>{if(n.id==='endscr')say(n.querySelector('h2').textContent+'. '+n.querySelector('p').textContent)}))}).observe(document.body,{childList:true});
const _rs=rescue;rescue=function(){_rs();say('Ash, this is the space station. Rescue ship inbound. Hold on, we have you.')};
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{if(!AC)startAudio();else if(AC.state==='suspended')AC.resume();}));
